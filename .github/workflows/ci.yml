name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altoque_pichanga_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Static code analysis with Ruff
        run: |
          python -m ruff check backend

      - name: Run Backend Tests
        env:
          SECRET_KEY: ci-test-secret-key-altoque-pichanga
          DEBUG: "True"
          DB_NAME: altoque_pichanga_db
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          DB_HOST: localhost
          DB_PORT: 5432
          USE_REDIS_CHANNEL_LAYER: "False"
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run
          pytest tests

  frontend-checks:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm run test:run

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build
